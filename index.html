          return year * 12 + 5;

        const [monthName, yearText] = label.split(" ");

        return { idx, next, progress, local, blend };
      }

      function displayState(progress) {
        const last = displayMilestones.length - 1;
        if (progress <= displayMilestones[0].progress + 1e-6) {
          return { idx: 0, next: Math.min(1, last), blend: 0 };
        }
        if (progress >= displayMilestones[last].progress - 1e-6) {
          return { idx: last, next: last, blend: 1 };
        }

        let idx = 0;
        while (idx < last && displayMilestones[idx + 1].progress <= progress + 1e-6) {
          idx += 1;
        }
        const next = Math.min(last, idx + 1);
        if (idx === next) {
          return { idx, next, blend: 1 };
        }

        const startP = displayMilestones[idx].progress;
        const endP = displayMilestones[next].progress;
        const local = clamp((progress - startP) / Math.max(1e-6, endP - startP), 0, 1);
        const blend = smoothstep(clamp((local - 0.42) / 0.58, 0, 1));
        return { idx, next, blend };
      }

      function updateTicker(t) {
        const speed = 760;
        const travel = t * speed;
        const shift = travel % TICKER_SPACING;
        const offset = Math.floor(travel / TICKER_SPACING);

        for (let i = 0; i < tickerSlots.length; i += 1) {
          const x = -180 + i * TICKER_SPACING - shift;
          const label = tickerLabels[(offset + i) % tickerLabels.length];
          const slot = tickerSlots[i];
          slot.setAttribute("x", x.toFixed(2));
          slot.textContent = label;
        }
      }

      function updateTimeline(sceneTime) {
        const motion = timelineState(sceneTime);
        const display = displayState(motion.progress);
        const current = displayMilestones[display.idx];
        const next = displayMilestones[display.next];
        const totalProgress = motion.progress;
        const scrollX = -TIMELINE_SCROLL_MAX * totalProgress;
        timelineMovingLayer.setAttribute("transform", `translate(${scrollX.toFixed(2)} 0)`);

        if (display.idx === display.next) {
          countMain.textContent = String(current.count);
          countMain.setAttribute("y", String(COUNT_LABEL_Y));
          countNext.setAttribute("y", String(COUNT_LABEL_Y));
          setOpacity(countMain, 1);
          setOpacity(countNext, 0);

          dateCurrent.textContent = labelToYearText(current.label);
          dateCurrent.setAttribute("y", String(DATE_LABEL_Y));
          dateNext.setAttribute("y", String(DATE_LABEL_Y));
          setDateWeight(dateCurrent);
          setDateWeight(dateNext);
          setOpacity(dateCurrent, 1);
          setOpacity(dateNext, 0);
        } else {
          const s = display.blend;

          countMain.textContent = String(current.count);
          countNext.textContent = String(next.count);
          countMain.setAttribute("y", String(COUNT_LABEL_Y));
          countNext.setAttribute("y", String(COUNT_LABEL_Y));
          setOpacity(countMain, 1 - Math.pow(s, 1.15));
          setOpacity(countNext, Math.pow(s, 1.15));

          const currentYear = labelToYearText(current.label);
          const nextYear = labelToYearText(next.label);
          dateCurrent.textContent = currentYear;
          dateNext.textContent = nextYear;
          setDateWeight(dateCurrent);
          setDateWeight(dateNext);
          dateCurrent.setAttribute("y", String(DATE_LABEL_Y));
          dateNext.setAttribute("y", String(DATE_LABEL_Y));
          if (currentYear === nextYear) {
            setOpacity(dateCurrent, 1);
            setOpacity(dateNext, 0);
          } else {
            setOpacity(dateCurrent, 1 - Math.pow(s, 1.1));
            setOpacity(dateNext, Math.pow(s, 1.1));
          }
        }

        currentDot.setAttribute("r", DOT_BASE_R.toFixed(2));
        currentDot.setAttribute("opacity", "1");
        currentDotHalo.setAttribute("opacity", "0");

        updateTicker(sceneTime);
      }

      function updateMapDots(revealProgress, alphaScale) {
        for (const d of brazilDots) {
          if (revealProgress <= d.delay) {
            d.el.setAttribute("r", d.baseR.toFixed(2));
            d.el.setAttribute("opacity", "0");
            continue;
          }
          const local = clamp((revealProgress - d.delay) / d.duration, 0, 1);
          const eased = easeOutCubic(local);
          d.el.setAttribute("r", lerp(d.baseR, d.targetR, eased).toFixed(2));
          d.el.setAttribute("opacity", ((0.08 + 0.64 * eased) * alphaScale).toFixed(3));
        }
      }

      function resetMapDots() {
        for (const d of brazilDots) {
          d.el.setAttribute("r", d.baseR.toFixed(2));
          d.el.setAttribute("opacity", "0");
        }
      }

      let mapVisible = false;
      resetMapDots();

      function render(t) {
        let uiOpacity = 1;
        let sceneTime = 0;
        let lineEnd = TIMELINE_LINE_LENGTH;
        let lineCoverProgress = 0;

        let scene3Opacity = 0;
        let circleR = DOT_BASE_R;
        let mapReveal = 0;
        let mapAlpha = 0;
        let finalTextOpacity = 0;

        if (t < SCENE1_END) {
          sceneTime = t;
          lineCoverProgress = clamp((t - (SCENE1_END - 0.34)) / 0.34, 0, 1);
        } else if (t < SHRINK_END) {
          const p = easeInOutCubic((t - SCENE1_END) / SHRINK_SECONDS);
          sceneTime = SCENE1_SECONDS;
          lineEnd = TIMELINE_LINE_LENGTH;
          uiOpacity = 1 - 0.06 * p;
          lineCoverProgress = 1;
        } else if (t < EXPAND_END) {
          const p = easeInOutCubic((t - SHRINK_END) / EXPAND_SECONDS);
          sceneTime = SCENE1_SECONDS;
          lineEnd = TIMELINE_LINE_LENGTH;
          uiOpacity = 1 - smoothstep(p);
          scene3Opacity = 1;
          circleR = lerp(DOT_BASE_R, CIRCLE_FULL_R, p);
          lineCoverProgress = 1;
        } else if (t < REVEAL_END) {
          const p = clamp((t - EXPAND_END) / REVEAL_SECONDS, 0, 1);
          sceneTime = SCENE1_SECONDS;
          lineEnd = TIMELINE_LINE_LENGTH;
          uiOpacity = 0;
          scene3Opacity = 1;
          circleR = CIRCLE_FULL_R;
          mapReveal = clamp(p / MAP_REVEAL_SLOW_FACTOR, 0, 1);
          mapAlpha = 0.62;
          finalTextOpacity = smoothstep(clamp((p - 0.12) / 0.58, 0, 1));
          lineCoverProgress = 1;
        } else if (t < HOLD_END) {
          const holdProgress = clamp((t - REVEAL_END) / HOLD_SECONDS, 0, 1);
          const settle = clamp(holdProgress / 0.72, 0, 1);
          sceneTime = SCENE1_SECONDS;
          lineEnd = TIMELINE_LINE_LENGTH;
          uiOpacity = 0;
          scene3Opacity = 1;
          circleR = CIRCLE_FULL_R;
          mapReveal = clamp((1 + settle * (MAP_REVEAL_SLOW_FACTOR - 1)) / MAP_REVEAL_SLOW_FACTOR, 0, 1);
          mapAlpha = 0.62;
          finalTextOpacity = 1;
          lineCoverProgress = 1;
        } else {
          const p = clamp((t - HOLD_END) / COLLAPSE_SECONDS, 0, 1);
          const e = easeInOutCubic(p);
          sceneTime = 0;
          lineEnd = TIMELINE_LINE_LENGTH;
          uiOpacity = smoothstep(p);
          scene3Opacity = 1 - smoothstep(clamp((p - 0.92) / 0.08, 0, 1));
          circleR = lerp(CIRCLE_FULL_R, DOT_BASE_R, e);
          mapReveal = 1;
          mapAlpha = 0.62 * (1 - smoothstep(p));
          finalTextOpacity = 1 - smoothstep(p);
          lineCoverProgress = 1 - smoothstep(p);
        }

        timelineLine.setAttribute("x2", lineEnd.toFixed(2));
        timelineLine.setAttribute("stroke", mixWhiteToAccent(lineCoverProgress));
        minorTicks.setAttribute("opacity", (1 - lineCoverProgress).toFixed(3));
        setOpacity(uiLayer, uiOpacity);
        updateTimeline(sceneTime);

        setOpacity(scene3Layer, scene3Opacity);
        clipCircle.setAttribute("r", circleR.toFixed(2));
        if (mapAlpha <= 0.001) {
          if (mapVisible) {
            resetMapDots();
            mapVisible = false;
          }
        } else {
          updateMapDots(mapReveal, mapAlpha);
          mapVisible = true;
        }
        setOpacity(finalContent, finalTextOpacity);
      }

      let start = null;
      function frame(now) {
        if (start === null) {
          start = now;
        }
        const elapsed = (now - start) / 1000;
        const wrapped = elapsed % LOOP_WITH_START_HOLD;
        const sceneTime = wrapped < START_HOLD_SECONDS ? 0 : (wrapped - START_HOLD_SECONDS);
        render(sceneTime);
        requestAnimationFrame(frame);
      }

      render(0);
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
